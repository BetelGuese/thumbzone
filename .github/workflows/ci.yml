name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsconfig.json includes .astro/types.d.ts, which only exists once
      # generated — .astro/ is gitignored, and nothing else in this job
      # would create it, so typecheck would pass here for the wrong reason
      # (nothing importing from astro:* yet) rather than because the types
      # genuinely resolve.
      - run: npx astro sync
      # A typecheck nobody runs is not a guarantee — this is the only place
      # `tsc` runs in CI, so a type error fails the same job unit tests do
      # rather than needing a check of its own that branch protection would
      # also have to know about.
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    # A ceiling, not a target: the suite runs in about six minutes, and this is
    # here for the case where it does not finish at all. `playwright install
    # --with-deps` shells out to apt-get and has wedged for 33 minutes against a
    # slow mirror — and because the Pages deploy is gated on this workflow
    # *succeeding*, a hang produces no deploy and no failure either, just a site
    # that silently never changes. That is the same reasoning that pairs
    # failOnFlakyTests with retries below: a silent non-result is worse than a
    # loud failure.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only the two engines the Playwright projects actually use
      # (mobile-safari emulates on WebKit, mobile-chrome on Chromium) —
      # installing Firefox too would cost time for coverage nothing exercises.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
