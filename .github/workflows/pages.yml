name: Pages

# Deploys only after CI has gone green on main's own run, rather than on the
# push itself. The two would otherwise race, and a push that broke the
# conformance suite would still publish: `astro build` succeeding proves the
# site compiles, not that the pattern still holds in it. An artefact whose
# whole claim is an executable conformance suite must not serve a build that
# suite has rejected.
#
# workflow_dispatch stays available so the site can be republished without a
# commit — useful when only Pages settings or the domain have changed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue rather than cancel: a superseded deploy still finishing is harmless,
# whereas cancelling one mid-flight can leave the site on a half-published
# state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A manual run has no workflow_run payload to inspect, so it is allowed
    # through on its own; an automatic run is gated on CI's conclusion.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsconfig.json includes .astro/types.d.ts, which only exists once
      # generated — .astro/ is gitignored, so nothing else here would create
      # it. Same reason ci.yml runs this before its typecheck.
      - run: npx astro sync

      # The base is derived from the repository name rather than written out,
      # so renaming the repository cannot leave a stale literal behind that
      # silently publishes every link one path segment too high.
      - run: npm run build
        env:
          TZ_BASE: /${{ github.event.repository.name }}

      # The conformance suite cannot cover this. It drives routes from the
      # registry against a build with no base, where the join is the identity
      # — so every assertion it makes about a route stays green whether the
      # deployed build is right or wrong. This is the only check that sees a
      # based build, and it reads the built output rather than the source,
      # because the source is not what gets served.
      - name: Verify no link escapes the base
        env:
          TZ_BASE: /${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          # Positive control first: a build that emitted no demo links at all
          # would satisfy the negative check below while proving nothing, and
          # this project has a standing rule against assertions that pass for
          # the wrong reason.
          found=$(grep -coE "(href|src)=\"$TZ_BASE/demo/" dist/index.html || true)
          if [ "$found" -eq 0 ]; then
            echo "No based demo links found in dist/index.html — the check has nothing to verify."
            exit 1
          fi
          echo "Found $found based demo reference(s)."

          # Any demo link that is root-relative but not under the base points
          # above the deployment and will 404.
          if grep -nE "(href|src)=\"/demo/" dist/index.html; then
            echo "The links above are missing the base and would 404 once deployed."
            echo "Route literals must be joined with joinBase() — see site/src/lib/routes.ts."
            exit 1
          fi
          echo "Every demo link is under $TZ_BASE."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
